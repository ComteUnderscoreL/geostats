<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Points 5K du Daily</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0b1220;
      color: white;
      font-family: system-ui, Arial, sans-serif;
    }

    body { overflow-x: hidden; }

    header {
      padding: 18px 22px 6px;
      text-align: center;
      z-index: 2;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 52px);
      letter-spacing: 0.04em;
    }

    .subtitle {
      margin-top: 6px;
      color: #c8d5df;
      font-size: 15px;
    }

    #stats {
      margin-top: 10px;
      color: rgba(255,255,255,0.62);
      font-size: 13px;
    }

    #globe-wrap {
      position: relative;
      display: grid;
      place-items: center;
      overflow: visible;
      height: min(120vh, 120vw);
      min-height: 720px;
    }

    svg {
      width: min(120vh, 120vw);
      height: min(120vh, 120vw);
      min-width: 520px;
      min-height: 520px;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    svg:active { cursor: grabbing; }

    .sphere {
      fill: #162444;
      stroke: #6f8fb8;
      stroke-width: 1.2;
    }

    .graticule {
      fill: none;
      stroke: rgba(255,255,255,0.18);
      stroke-width: 0.5;
    }

    .land-base {
      fill: #cfc6ad;
      stroke: none;
    }

    .land-outline {
      fill: none;
      stroke: #1f2a44;
      stroke-width: 0.55;
      pointer-events: none;
    }

    .point {
      stroke: #0b1220;
      stroke-width: 0.75;
      opacity: 0.90;
      cursor: pointer;
      pointer-events: all;
    }

    .point.single {
      fill: #6ee7ff;
    }

    .point:hover {
      opacity: 1;
      stroke: #ffffff;
      stroke-width: 2;
      filter: drop-shadow(0 0 6px rgba(255,255,255,0.85));
    }

    .point.multi {
      fill: #f2b705;
    }

    .tooltip {
      position: fixed;
      display: none;
      pointer-events: none;
      background: rgba(11,18,32,0.96);
      color: white;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 14px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.35);
      z-index: 20;
      max-width: 360px;
    }

    .tooltip strong {
      display: block;
      font-size: 15px;
      margin-bottom: 3px;
    }

    .tooltip .small {
      color: rgba(255,255,255,0.62);
      font-size: 12px;
      margin-top: 4px;
    }

    .players {
      margin-top: 6px;
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .player-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 7px 2px 3px;
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.16);
      font-size: 12px;
    }

    .player-initial {
      display: inline-grid;
      place-items: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.24);
      font-size: 11px;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      flex: 0 0 auto;
    }

    .bottom-link {
      position: fixed;
      left: 16px;
      bottom: 14px;
      color: rgba(255,255,255,0.55);
      font-size: 13px;
      z-index: 2;
      text-decoration: none;
      background: none;
      border: none;
      padding: 0;
    }

    .bottom-link:hover {
      color: rgba(255,255,255,0.9);
      text-decoration: underline;
    }

    .player-table-section {
      max-width: 720px;
      margin: 20px auto 46px;
      padding: 0 16px;
    }

    .player-table-section h2 {
      margin: 0 0 10px;
      font-size: 22px;
      letter-spacing: 0.03em;
    }

    .player-table-wrap {
      overflow-x: auto;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.05);
    }

    .player-table {
      width: 100%;
      border-collapse: collapse;
    }

    .player-table th,
    .player-table td {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.10);
      text-align: left;
      font-size: 14px;
    }

    .player-table th {
      color: rgba(255,255,255,0.72);
      font-weight: 600;
      background: rgba(255,255,255,0.06);
    }

    .player-table tr:last-child td {
      border-bottom: none;
    }

    .player-table .num {
      text-align: right;
      font-weight: 700;
    }

    .player-row {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    @media (max-width: 700px) {
      #globe-wrap {
        height: min(115vh, 115vw);
        min-height: 620px;
      }

      svg {
        width: min(115vh, 115vw);
        height: min(115vh, 115vw);
        min-width: 460px;
        min-height: 460px;
      }

      .bottom-link {
        position: static;
        display: block;
        margin: 0 16px 16px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Points 5K du Daily</h1>
    <div class="subtitle">Tous les lieux du daily où au moins un joueur a fait 5K</div>
    <div id="stats">Chargement des TSV…</div>
  </header>

  <main id="globe-wrap">
    <svg id="globe" viewBox="0 0 900 900"><defs></defs></svg>
    <div id="tooltip" class="tooltip"></div>
  </main>

  <section class="player-table-section">
    <h2>Classement 5K</h2>
    <div class="player-table-wrap">
      <table class="player-table">
        <thead>
          <tr>
            <th>Joueur</th>
            <th class="num">Points 5K</th>
          </tr>
        </thead>
        <tbody id="player-ranking">
          <tr><td colspan="2">Chargement…</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <a class="bottom-link" href="index.html">← Retour au daily</a>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
  <script>
    const TSV_URLS = [
      "https://raw.githubusercontent.com/ComteUnderscoreL/geostats/main/data/rounds.tsv"
    ];

    const LAND_URL = "https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json";

    // Distance max considérée comme 5K.
    // 0.2 km = 200 mètres.
    const FIVE_K_MAX_DISTANCE_KM = 0.2;

    const svg = d3.select("#globe");
    const tooltip = d3.select("#tooltip");
    const width = 900, height = 900;

    let baseScale = 390;
    let currentScale = baseScale;
    let rotation = [0, -20, 0];
    let targetRotation = [0, -20, 0];
    let smoothTimer = null;
    let landData = null;
    let pointData = [];

    const projection = d3.geoOrthographic()
      .scale(currentScale)
      .translate([width / 2, height / 2])
      .rotate(rotation)
      .clipAngle(90);

    const path = d3.geoPath(projection);
    const graticule = d3.geoGraticule10();
    const sphere = { type: "Sphere" };

    const g = svg.append("g");

    g.append("path").datum(sphere).attr("class", "sphere");
    g.append("path").datum(graticule).attr("class", "graticule");

    const landBasePath = g.append("path").attr("class", "land-base");
    const landOutlinePath = g.append("path").attr("class", "land-outline");
    const pointGroup = g.append("g");

    function normalizeLon(lon) {
      return ((lon + 180) % 360 + 360) % 360 - 180;
    }

    function clampLat(lat) {
      return Math.max(-89.5, Math.min(89.5, lat));
    }

    function isVisible(lng, lat) {
      const rotated = d3.geoRotation(projection.rotate())([lng, lat]);
      return rotated[0] > -90 && rotated[0] < 90;
    }

    function parseNumber(value) {
      if (value === undefined || value === null) return NaN;
      return Number(String(value).trim().replace(",", "."));
    }

    function pick(row, names) {
      for (const name of names) {
        if (row[name] !== undefined && row[name] !== "") return row[name];
      }

      const lower = {};
      for (const key of Object.keys(row)) {
        lower[key.trim().toLowerCase()] = row[key];
      }

      for (const name of names) {
        const key = name.trim().toLowerCase();
        if (lower[key] !== undefined && lower[key] !== "") return lower[key];
      }

      return "";
    }

    function normalizePlayerId(name) {
      return String(name || "unknown")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "_")
        .replace(/[^a-z0-9_-]/g, "") || "unknown";
    }

    function streetViewUrl(lng, lat) {
      return `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lng}`;
    }

    function formatCoord(value) {
      return Number(value).toFixed(5);
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function playerPillHtml(player) {
      const name = player.name || player.id || "unknown";
      const safeName = escapeHtml(name);

      return `
        <span class="player-pill" title="${safeName}">
          <span class="player-initial">${safeName.slice(0, 1).toUpperCase()}</span>
          <span>${safeName}</span>
        </span>
      `;
    }
        });
      });

      await Promise.all([...playersById.values()].map(async player => {
        const avatar = await fetchGeoGuessrAvatar(player.id);
        if (avatar) player.avatar_url = avatar;
      }));
    }

    function positionTooltip(event) {
      const pad = 14;

      let left = event.clientX + pad;
      let top = event.clientY + pad;

      tooltip
        .style("left", `${left}px`)
        .style("top", `${top}px`);

      const rect = tooltip.node().getBoundingClientRect();

      if (rect.right > window.innerWidth - 8) left = event.clientX - rect.width - pad;
      if (rect.bottom > window.innerHeight - 8) top = event.clientY - rect.height - pad;

      tooltip
        .style("left", `${Math.max(8, left)}px`)
        .style("top", `${Math.max(8, top)}px`);
    }

    function showTooltip(event, d) {
      const players = d.players.slice(0, 14).map(playerPillHtml).join("");
      const more = d.players.length > 14 ? `<span class="player-pill">+${d.players.length - 14}</span>` : "";

      tooltip
        .style("display", "block")
        .html(`
          <strong>${d.players.length} joueur${d.players.length > 1 ? "s ont" : " a"} 5K</strong>
          <div>${d.country_code || "Pays inconnu"} · ${formatCoord(d.lat)}, ${formatCoord(d.lng)}</div>
          <div class="small">${d.records.length} round${d.records.length > 1 ? "s" : ""} 5K · max ${FIVE_K_MAX_DISTANCE_KM} km</div>
          <div class="players">${players}${more}</div>
          <div class="small">Clique pour ouvrir Google Street View</div>
        `);

      positionTooltip(event);
    }

    function hideTooltip() {
      tooltip.style("display", "none");
    }

    function redraw() {
      g.select(".sphere").attr("d", path);
      g.select(".graticule").attr("d", path);

      if (landData) {
        landBasePath.datum(landData).attr("d", path);
        landOutlinePath.datum(landData).attr("d", path);
      }

      const radius = Math.max(1.6, Math.min(4.5, currentScale / 160));

      const points = pointGroup
        .selectAll("circle")
        .data(pointData, d => d.key);

      points.enter()
        .append("circle")
        .attr("class", d => d.players.length > 1 ? "point multi" : "point single")
        .on("mouseenter", (event, d) => showTooltip(event, d))
        .on("mousemove", (event) => positionTooltip(event))
        .on("mouseleave", hideTooltip)
        .on("click", (event, d) => window.open(streetViewUrl(d.lng, d.lat), "_blank"))
        .merge(points)
        .attr("cx", d => {
          const p = projection([d.lng, d.lat]);
          return p ? p[0] : -9999;
        })
        .attr("cy", d => {
          const p = projection([d.lng, d.lat]);
          return p ? p[1] : -9999;
        })
        .style("display", d => isVisible(d.lng, d.lat) ? null : "none")
        .attr("r", d => Math.min(radius + Math.sqrt(d.players.length) * 0.8, 9));

      points.exit().remove();
    }

    function applyRotation(r) {
      rotation = [normalizeLon(r[0]), clampLat(r[1]), 0];
      projection.rotate(rotation);
      hideTooltip();
      redraw();
    }

    function startSmoothLoop() {
      if (smoothTimer) return;

      smoothTimer = d3.timer(() => {
        const ease = 0.18;

        let lonDiff = targetRotation[0] - rotation[0];

        if (lonDiff > 180) lonDiff -= 360;
        if (lonDiff < -180) lonDiff += 360;

        const latDiff = targetRotation[1] - rotation[1];

        if (Math.abs(lonDiff) < 0.01 && Math.abs(latDiff) < 0.01) {
          applyRotation(targetRotation);
          smoothTimer.stop();
          smoothTimer = null;
          return;
        }

        applyRotation([
          rotation[0] + lonDiff * ease,
          rotation[1] + latDiff * ease,
          0
        ]);
      });
    }

    function setTargetRotation(r) {
      targetRotation = [normalizeLon(r[0]), clampLat(r[1]), 0];
      startSmoothLoop();
    }

    function tsvRowsTo5kRecords(rows, sourceName) {
      const records = [];

      for (const row of rows) {
        const lat = parseNumber(pick(row, ["lat", "latitude"]));
        const lng = parseNumber(pick(row, ["lng", "lon", "longitude"]));
        const distance = parseNumber(pick(row, ["distance", "distance_km", "distance (km)", "dist_km"]));

        if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;
        if (!Number.isFinite(distance) || distance > FIVE_K_MAX_DISTANCE_KM) continue;

        const player = String(pick(row, ["player", "name", "player_name"]) || "unknown");
        const playerId = String(pick(row, ["player_id", "user_id"]) || normalizePlayerId(player));
        records.push({
          lat,
          lng,
          distance_km: distance,
          country_code: String(pick(row, ["country_code", "country"]) || ""),
          numero: String(pick(row, ["numero", "challenge", "challenge_id", "id"]) || ""),
          round: String(pick(row, ["round", "round_number"]) || ""),
          player_id: playerId,
          player,
          source_file: sourceName
        });
      }

      return records;
    }

    function groupRecords(records) {
      const grouped = new Map();

      for (const rec of records) {
        const key = `${rec.lat.toFixed(5)},${rec.lng.toFixed(5)}`;

        if (!grouped.has(key)) {
          grouped.set(key, {
            key,
            lat: rec.lat,
            lng: rec.lng,
            country_code: rec.country_code,
            players: new Map(),
            records: []
          });
        }

        const point = grouped.get(key);

        // Dédup joueur sur un même point.
        // On privilégie le pseudo normalisé, car le player_id peut être absent/différent
        // selon les exports TSV rounds.tsv / rounds2.tsv.
        const displayName = rec.player || rec.player_id || "unknown";
        const playerKey = normalizePlayerId(displayName);
        const playerId = rec.player_id || playerKey;

        const existingPlayer = point.players.get(playerKey);

        point.players.set(playerKey, {
          id: existingPlayer?.id || playerId,
          name: existingPlayer?.name || displayName,
          avatar_url: existingPlayer?.avatar_url || rec.avatar_url || ""
        });

        point.records.push(rec);

        if (!point.country_code && rec.country_code) {
          point.country_code = rec.country_code;
        }
      }

      return [...grouped.values()].map(point => ({
        ...point,
        players: [...point.players.values()].sort((a, b) => a.name.localeCompare(b.name))
      }));
    }

    let dragStart = null;
    let dragStartRotation = null;

    svg.call(d3.drag()
      .on("start", event => {
        if (smoothTimer) {
          smoothTimer.stop();
          smoothTimer = null;
        }

        hideTooltip();

        dragStart = [event.x, event.y];
        dragStartRotation = [...rotation];
        targetRotation = [...rotation];
      })
      .on("drag", event => {
        const zoomFactor = currentScale / baseScale;
        const speed = 0.35 / zoomFactor;

        const dx = event.x - dragStart[0];
        const dy = event.y - dragStart[1];

        const newLon = dragStartRotation[0] + dx * speed;
        const newLat = dragStartRotation[1] - dy * speed;

        targetRotation = [normalizeLon(newLon), clampLat(newLat), 0];
        applyRotation(targetRotation);
      })
      .on("end", () => {
        dragStart = null;
        dragStartRotation = null;
      })
    );

    svg.call(d3.zoom()
      .scaleExtent([0.6, 10])
      .filter(event => event.type === "wheel")
      .on("zoom", event => {
        currentScale = baseScale * event.transform.k;
        projection.scale(currentScale);
        hideTooltip();
        redraw();
      })
    );

    svg.on("dblclick.zoom", null);
    svg.on("dblclick", () => setTargetRotation([0, -20, 0]));

    function buildPlayerRanking(points) {
      const players = new Map();

      points.forEach(point => {
        const uniquePlayersOnPoint = new Set();

        point.records.forEach(rec => {
          const displayName = rec.player || rec.player_id || "unknown";
          const key = normalizePlayerId(displayName);

          if (!players.has(key)) {
            players.set(key, {
              id: rec.player_id || key,
              name: displayName,
              uniquePoints: 0,
              rounds: 0
            });
          }

          const player = players.get(key);
          player.rounds += 1;
          uniquePlayersOnPoint.add(key);
        });

        uniquePlayersOnPoint.forEach(key => {
          const player = players.get(key);
          if (player) player.uniquePoints += 1;
        });
      });

      return [...players.values()].sort((a, b) => {
        if (b.uniquePoints !== a.uniquePoints) return b.uniquePoints - a.uniquePoints;
        return a.name.localeCompare(b.name);
      });
    }

    function renderPlayerRanking(ranking) {
      const tbody = document.getElementById("player-ranking");

      if (!ranking.length) {
        tbody.innerHTML = `<tr><td colspan="2">Aucun 5K trouvé</td></tr>`;
        return;
      }

      tbody.innerHTML = ranking.map(player => `
        <tr>
          <td>
            <span class="player-row">
              ${playerPillHtml(player)}
            </span>
          </td>
          <td class="num">${player.uniquePoints}</td>
        </tr>
      `).join("");
    }

    async function load() {
      try {
        const [world, ...tsvTexts] = await Promise.all([
          d3.json(LAND_URL),
          ...TSV_URLS.map(url => d3.text(url + "?v=" + Date.now()))
        ]);

        landData = topojson.feature(world, world.objects.land);

        const records = [];

        tsvTexts.forEach((text, i) => {
          const rows = d3.tsvParse(text);
          records.push(...tsvRowsTo5kRecords(rows, TSV_URLS[i].split("/").pop()));
        });

        pointData = groupRecords(records);

        renderPlayerRanking(buildPlayerRanking(pointData));

        const totalPlayers = new Set();
        pointData.forEach(point => point.players.forEach(p => totalPlayers.add(p.id || p.name)));

        document.getElementById("stats").textContent =
          `${pointData.length} lieux 5K uniques · ${records.length} rounds 5K · ${totalPlayers.size} joueurs`;

        redraw();
      } catch (error) {
        console.error(error);
        document.getElementById("stats").textContent = "Impossible de charger les TSV de geostats";
      }
    }

    load();
  </script>
</body>
</html>
